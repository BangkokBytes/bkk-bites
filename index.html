<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #gameboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 20px auto; width: 350px; }
        .cell { width: 50px; height: 50px; background-color: #e0e0e0; border-radius: 50%; cursor: pointer; }
        .player1 { background-color: red; }
        .player2 { background-color: yellow; }
    </style>
</head>
<body>
    <h1>Connect 4</h1>
    <div id="gameboard"></div>
    <script>
        const board = Array.from(Array(6), () => Array(7).fill(0));
        const gameboardElement = document.getElementById('gameboard');

        function createCell(row, col) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.column = col;
            cell.onclick = () => dropDisc(col);
            gameboardElement.appendChild(cell);
        }

        for (let col = 0; col < 7; col++) {
            for (let row = 0; row < 6; row++) {
                createCell(row, col);
            }
        }

        let currentPlayer = 1;

        function dropDisc(col) {
            for (let row = 5; row >= 0; row--) {
                if (board[row][col] === 0) {
                    board[row][col] = currentPlayer;
                    const cell = gameboardElement.children[row * 7 + col];
                    cell.classList.add(currentPlayer === 1 ? 'player1' : 'player2');
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    break;
                }
            }
        }

        // Additional code for checking win conditions can be added here.
    </script>
</body>
</html>
