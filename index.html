<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Connect 4</title>
    <style>
        body {
            background-color: #282c34;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(7, 50px);
            gap: 5px;
            margin: 20px auto;
        }
        .cell {
            width: 50px;
            height: 50px;
            background-color: #444;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell.red {
            background-color: red;
        }
        .cell.yellow {
            background-color: yellow;
        }
        button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
        .stats {
            margin: 20px 0;
        }
        .animation {
            transition: 0.5s;
        }
    </style>
</head>
<body>
    <h1>Retro Connect 4</h1>
    <div class="stats">
        <h2>Tilastot</h2>
        <p>Voitot: <span id="wins">0</span></p>
        <p>Tasapelit: <span id="draws">0</span></p>
        <p>Häviöt: <span id="losses">0</span></p>
    </div>
    <div class="board" id="board"></div>
    <div>
        <label for="player">PELAAJA SIPOOSTA</label>
        <select id="player">
            <option value="red">Punainen</option>
            <option value="yellow">Keltainen</option>
        </select>
        <label for="difficulty">Vaikeusaste TARVIIKO KYSYÄ</label>
        <select id="difficulty">
            <option value="easy">Helppo</option>
            <option value="medium">Keskitaso</option>
            <option value="hard">Vaikea</option>
        </select>
        <button id="start">ALOITA!</button>
    </div>
    <script>
        const board = document.getElementById('board');
        const wins = document.getElementById('wins');
        const draws = document.getElementById('draws');
        const losses = document.getElementById('losses');
        const playerSelect = document.getElementById('player');
        const difficultySelect = document.getElementById('difficulty');
        const startButton = document.getElementById('start');
        let currentPlayer;
        let gameBoard;
        let isGameActive = false;
        const winningConditions = [
            // Horizontal
            [0, 1, 2, 3], [1, 2, 3, 4], [2, 3, 4, 5], [3, 4, 5, 6],
            [7, 8, 9, 10], [8, 9, 10, 11], [9, 10, 11, 12], [10, 11, 12, 13],
            [14, 15, 16, 17], [15, 16, 17, 18], [16, 17, 18, 19], [17, 18, 19, 20],
            [21, 22, 23, 24], [22, 23, 24, 25], [23, 24, 25, 26], [24, 25, 26, 27],
            [28, 29, 30, 31], [29, 30, 31, 32], [30, 31, 32, 33], [31, 32, 33, 34],
            [35, 36, 37, 38], [36, 37, 38, 39], [37, 38, 39, 40], [38, 39, 40, 41],
            // Vertical
            [0, 7, 14, 21], [1, 8, 15, 22], [2, 9, 16, 23], [3, 10, 17, 24],
            [4, 11, 18, 25], [5, 12, 19, 26], [6, 13, 20, 27],
            // Diagonal
            [3, 10, 17, 24], [4, 11, 18, 25], [5, 12, 19, 26], [6, 13, 20, 27],
            [0, 8, 16, 24], [1, 9, 17, 25], [2, 10, 18, 26], [3, 11, 19, 27],
            [21, 28, 35, 42], [22, 29, 36, 43], [23, 30, 37, 44], [24, 31, 38, 45]
        ];

        function startGame() {
            gameBoard = Array(42).fill(0);
            currentPlayer = playerSelect.value;
            isGameActive = true;
            renderBoard();
        }

        function renderBoard() {
            board.innerHTML = '';
            gameBoard.forEach((cell, index) => {
                const cellDiv = document.createElement('div');
                cellDiv.classList.add('cell');
                if (cell === 'red') cellDiv.classList.add('red');
                if (cell === 'yellow') cellDiv.classList.add('yellow');
                cellDiv.addEventListener('click', () => handleCellClick(index));
                board.appendChild(cellDiv);
            });
        }

        function handleCellClick(index) {
            if (!isGameActive || gameBoard[index] !== 0) return;
            gameBoard[index] = currentPlayer;
            checkWin();
            currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
            renderBoard();
        }

        function checkWin() {
            for (const condition of winningConditions) {
                const [a, b, c, d] = condition;
                if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c] && gameBoard[a] === gameBoard[d]) {
                    alert((gameBoard[a] === 'red' ? 'Punainen Voitti!' : 'Keltainen Voitti!'));
                    resetsStats();
                    return;
                }
            }
            if (!gameBoard.includes(0)) {
                alert('Tasapeli!');
                resetsStats();
            }
        }

        function resetsStats() {
            isGameActive = false;
            if (currentPlayer === 'red') {
                wins.innerText = parseInt(wins.innerText) + 1;
            } else {
                losses.innerText = parseInt(losses.innerText) + 1;
            }
            renderBoard();
        }

        startButton.addEventListener('click', startGame);
    </script>
</body>
</html>
