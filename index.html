<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bkk Bites</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game">
        <h1>PELAJA SIPOOSTA</h1>
        <label for="color">VALITSE VÄRI. JOS OLET VÄRISOKEA, VALITSE OIKEA TAI VASEN.</label>
        <select id="color">
            <option value="red">Punainen</option>
            <option value="blue">Sininen</option>
            <option value="green">Vihreä</option>
        </select>
        <label for="starter">KUMPI ON VÄHEMMÄN HUMALASSA?</label>
        <select id="starter">
            <option value="player">ROLLE</option>
            <option value="computer">PAAVO VÄYRYNEN</option>
        </select>
        <label for="difficulty">VAIKEUSASTE (TARVIIKO KYSYÄ)</label>
        <select id="difficulty">
            <option value="easy">TURKU</option>
            <option value="medium">SIPOO</option>
            <option value="hard">BANGKOK</option>
        </select>
        <button id="start-button">YRITÄ OSUA TÄHÄN</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
